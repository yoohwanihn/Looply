# =============================================
# SNS 플랫폼 - 프로덕션 앱 오버라이드
# 단독 실행 금지. 반드시 docker-compose.yml과 함께 사용:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================

services:

  backend:
    image: sns-backend:latest
    container_name: sns-backend
    restart: unless-stopped
    build: !reset null
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    volumes: !reset []
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sns-net

  frontend:
    image: sns-frontend:latest
    container_name: sns-frontend
    restart: unless-stopped
    build: !reset null
    ports:
      - "80:80"
    volumes: !reset []
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sns-net
