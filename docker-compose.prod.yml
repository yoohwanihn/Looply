# =============================================
# SNS 플랫폼 - 프로덕션 앱 오버라이드
# 단독 실행 금지. 반드시 docker-compose.yml과 함께 사용:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================

services:

  backend:
    image: sns-backend:latest
    container_name: sns-backend
    restart: unless-stopped
    build: !reset null
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sns_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sns_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis_password}
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_must_be_at_least_256bits_long_string_here}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-3600000}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800000}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9100}
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    volumes: !reset []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sns-net

  frontend:
    image: sns-frontend:latest
    container_name: sns-frontend
    restart: unless-stopped
    build: !reset null
    ports:
      - "80:80"
    volumes: !reset []
    depends_on:
      - backend
    networks:
      - sns-net
